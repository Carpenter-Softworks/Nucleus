# Submits the Maven dependency graph on each push to main, for Dependabot alerts. Replaces
# GitHub's automatic submission, which runs a bare mvn before .devkit exists and so looks
# devkit's parent up remotely, the failure mode devkit's contract names.

name: Dependency graph

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    # devkitw bounds each git command where timeout(1) is found, not the job or what git starts.
    timeout-minutes: 20
    # The snapshot API needs contents: write, and the action generates and submits in one
    # process, so this token sits beside the unverified dependency closure and build
    # extensions (ADR-14). Accepted for main's reviewed code; it cannot edit workflows.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "25"
          check-latest: true # not an older 25.x the runner has cached
      # The action runs mvn from PATH; make that devkit's pinned, checksum-verified Maven.
      # get_maven.sh is devkit's interface for a consumer script, and it fails before Maven
      # starts if the pom would look the parent up remotely.
      - name: Fetch devkit and its pinned Maven
        run: |
          DEVKIT=$(./devkitw path)
          . "$DEVKIT/scripts/lib/get_maven.sh"
          dirname "$MVN_LAUNCHER" >> "$GITHUB_PATH"
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
